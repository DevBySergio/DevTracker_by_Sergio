name: Validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run complete validation gate
        run: xvfb-run -a npm run validate

      - name: Preserve browser failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webview-test-results-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Preserve validated VSIX
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: devtracker-vsix-${{ github.run_attempt }}
          path: artifacts/*.vsix
          if-no-files-found: error
          retention-days: 14
